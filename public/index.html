<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackChat - Discord Clone</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Whitney:wght@300;400;500;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Whitney', sans-serif; 
      height: 100vh; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
      animation: gradientShift 10s ease infinite;
    }
    
    @keyframes gradientShift {
      0%, 100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
      50% { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    }
    
    .container { height: 100vh; display: flex; }
    
    /* Sidebar */
    .sidebar { 
      width: 240px; 
      background: rgba(32, 34, 37, 0.95);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255,255,255,0.1);
      animation: slideInLeft 0.5s ease-out;
    }
    
    @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    
    .server-name { 
      padding: 25px 20px; 
      background: linear-gradient(135deg, #5865f2, #4752c4);
      text-align: center; 
      font-size: 18px; 
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    
    .channels { padding: 15px; }
    .channel { 
      padding: 12px 16px; 
      margin: 4px 0; 
      cursor: pointer; 
      border-radius: 8px;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .channel:hover { background: rgba(88, 101, 242, 0.2); transform: translateX(5px); }
    .channel.active { 
      background: linear-gradient(135deg, #5865f2, #4752c4); 
      color: white;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
    }
    
    /* Main Chat */
    .main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { 
      height: 60px; 
      background: rgba(32, 34, 37, 0.95);
      backdrop-filter: blur(20px);
      padding: 0 25px; 
      display: flex; 
      align-items: center; 
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    #currentChannel { 
      font-size: 18px; 
      font-weight: 600; 
      background: linear-gradient(135deg, #fff, #e4e7ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }
    
    @keyframes glow { from { text-shadow: 0 0 5px rgba(255,255,255,0.5); } to { text-shadow: 0 0 20px rgba(88,101,242,0.8); } }
    
    #userProfile { 
      margin-left: auto; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }
    #userProfile:hover { background: rgba(88,101,242,0.2); transform: scale(1.05); }
    
    .avatar { 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      border: 3px solid #5865f2;
      transition: all 0.3s ease;
    }
    
    /* Messages */
    .messages { 
      flex: 1; 
      padding: 30px; 
      overflow-y: auto;
      background: rgba(39, 41, 44, 0.8);
      backdrop-filter: blur(10px);
    }
    
    .message { 
      display: flex; 
      gap: 15px; 
      margin-bottom: 25px;
      animation: messageSlide 0.4s ease-out;
      transform-origin: left;
    }
    
    @keyframes messageSlide { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    
    .message-content { flex: 1; }
    .username { 
      font-weight: 600; 
      background: linear-gradient(135deg, #5865f2, #7289da);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 16px;
    }
    .timestamp { 
      color: #b9bbbe; 
      font-size: 13px; 
      margin-left: 10px;
    }
    .message-text { 
      margin-top: 5px; 
      line-height: 1.5; 
      color: #dcddde;
      font-size: 16px;
    }
    
    /* Input */
    .input-area { 
      padding: 25px 30px; 
      background: rgba(32, 34, 37, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .input-container { 
      display: flex; 
      gap: 15px; 
      max-width: 800px;
      margin: 0 auto;
    }
    .message-input { 
      flex: 1; 
      padding: 18px 25px; 
      border-radius: 25px; 
      border: 2px solid rgba(88,101,242,0.3);
      background: rgba(69, 76, 94, 0.8);
      color: #dcddde;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .message-input:focus {
      outline: none;
      border-color: #5865f2;
      box-shadow: 0 0 20px rgba(88,101,242,0.3);
      transform: scale(1.02);
    }
    .send-btn { 
      padding: 18px 30px; 
      background: linear-gradient(135deg, #5865f2, #4752c4);
      border: none; 
      border-radius: 25px; 
      color: white; 
      font-size: 16px; 
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(88,101,242,0.4);
    }
    .send-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(88,101,242,0.6); }
    
    /* Modal */
    .modal { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.8); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      backdrop-filter: blur(10px);
      animation: modalFade 0.3s ease-out;
    }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    
    .modal-content { 
      background: rgba(32, 34, 37, 0.98); 
      padding: 40px; 
      border-radius: 20px; 
      width: 90%; 
      max-width: 450px;
      border: 1px solid rgba(88,101,242,0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: modalSlide 0.4s ease-out;
    }
    @keyframes modalSlide { from { transform: scale(0.7) translateY(50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    
    .modal h2 { 
      text-align: center; 
      margin-bottom: 30px; 
      font-size: 28px; 
      background: linear-gradient(135deg, #5865f2, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .form-group { margin-bottom: 25px; }
    .form-group input { 
      width: 100%; 
      padding: 18px 20px; 
      border-radius: 12px; 
      border: 2px solid rgba(88,101,242,0.3); 
      background: rgba(69, 76, 94, 0.8);
      color: #dcddde;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .form-group input:focus { 
      outline: none; 
      border-color: #5865f2; 
      box-shadow: 0 0 20px rgba(88,101,242,0.3);
    }
    
    .btn { 
      width: 100%; 
      padding: 18px; 
      border: none; 
      border-radius: 12px; 
      font-size: 18px; 
      font-weight: 600;
      cursor: pointer; 
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }
    .btn-primary { background: linear-gradient(135deg, #5865f2, #4752c4); color: white; box-shadow: 0 4px 15px rgba(88,101,242,0.4); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(88,101,242,0.6); }
    .btn-secondary { background: rgba(79, 84, 92, 0.6); color: #dcddde; border: 2px solid rgba(88,101,242,0.3); }
    
    .hidden { display: none !important; }
    
    /* Scrollbar */
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-track { background: rgba(39,41,44,0.5); }
    .messages::-webkit-scrollbar-thumb { background: rgba(88,101,242,0.5); border-radius: 4px; }
    
    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .server-name, .channel span { display: none; }
      .channel::before { content: '📱'; }
    }
  </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="authModal" class="modal">
      <div class="modal-content">
        <h2 id="modalTitle">Welcome to BlackChat</h2>
        <form id="authForm">
          <div class="form-group">
            <input type="email" id="email" placeholder="✉️ Email" required>
          </div>
          <div class="form-group">
            <input type="text" id="username" placeholder="👤 Username" required>
          </div>
          <div class="form-group">
            <input type="password" id="password" placeholder="🔒 Password" required>
          </div>
